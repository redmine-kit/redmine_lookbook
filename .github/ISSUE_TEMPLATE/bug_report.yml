name: Bug report
description: A preview does not render, or something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. You can write in English or Japanese (日本語でも書けます).
        To report a vulnerability, do not open an issue; see SECURITY.md.
  - type: input
    id: redmine
    attributes:
      label: Redmine version
      placeholder: "7.0.3"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Redmine Lookbook version or commit
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true
  - type: input
    id: lookbook
    attributes:
      label: Lookbook version
      description: From `bundle list | grep lookbook`.
      placeholder: "2.3.15"
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Docker (docker/compose.yml)
        - An existing Redmine
    validations:
      required: true
  - type: input
    id: preview
    attributes:
      label: Preview
      description: The preview and the toolbar options (theme, language, layout).
      placeholder: "pages/issues/show, theme: Default, language: ja, layout: None"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The related part of log/development.log, if any.
      render: text
