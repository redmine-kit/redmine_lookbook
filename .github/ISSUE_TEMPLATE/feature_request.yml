name: Feature request
description: A new preview, toolbar option, or other improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: You can write in English or Japanese (日本語でも書けます).
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task or problem, for example a Redmine screen you want to check with your theme.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Paths of Redmine pages help for new page previews.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
