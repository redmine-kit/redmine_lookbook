name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plugin's tests in Redmine 7.0.3 on PostgreSQL 16 (bin/test), in Docker,
  # without Lookbook.
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/test
      - if: always()
        run: bin/services --down

  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # RedmineKit is the namespace all of Redmine Kit's plugins share
      # (Zeitwerk makes it from their lib/redmine_kit/ folders): no plugin
      # defines it, or another plugin's file of the same name is ignored.
      - name: The plugin defines no lib/redmine_kit.rb
        run: test ! -e lib/redmine_kit.rb

      - name: Start the development Redmine
        run: docker compose -f docker/compose.yml up -d --build

      - name: Wait for Redmine
        run: |
          for _ in $(seq 1 90); do
            if curl -fs -o /dev/null http://127.0.0.1:3000/lookbook; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Check every preview
        run: docker compose -f docker/compose.yml exec -T redmine ruby plugins/redmine_kit_lookbook/bin/check-previews

      # In production, Rails does not require the development group, so
      # Lookbook is not loaded, as on a production server.
      - name: Check loading in production, without Lookbook
        run: >-
          docker compose -f docker/compose.yml exec -T
          -e RAILS_ENV=production -e SECRET_KEY_BASE=check -e DATABASE_URL=sqlite3:/tmp/check.sqlite3
          redmine bin/rails zeitwerk:check

      - name: Show the Redmine log
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail=200
