name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the development Redmine
        run: docker compose -f docker/compose.yml up -d --build

      - name: Wait for Redmine
        run: |
          for i in $(seq 1 90); do
            if curl -fs -o /dev/null http://127.0.0.1:3000/lookbook; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Check every preview
        run: docker compose -f docker/compose.yml exec -T redmine ruby plugins/redmine_lookbook/bin/check-previews

      # In production, Rails does not require the development group, so
      # Lookbook is not loaded, as on a production server.
      - name: Check loading in production, without Lookbook
        run: >-
          docker compose -f docker/compose.yml exec -T
          -e RAILS_ENV=production -e SECRET_KEY_BASE=check -e DATABASE_URL=sqlite3:/tmp/check.sqlite3
          redmine bin/rails zeitwerk:check

      - name: Show the Redmine log
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail=200
