# Services for the tests (bin/test) in Docker; bin/services starts the same in
# Apple container. No host ports: the tests run in a container on the same
# network.
services:
  postgres:
    image: postgres:16.16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
